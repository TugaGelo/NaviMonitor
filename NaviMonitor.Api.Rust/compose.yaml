# Local Postgres for development and integration tests:
#   docker compose up -d
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: navi
      POSTGRES_PASSWORD: navi
      POSTGRES_DB: navimonitor
    ports:
      - "5433:5432"
    volumes:
      - navi-pg:/var/lib/postgresql

volumes:
  navi-pg:
